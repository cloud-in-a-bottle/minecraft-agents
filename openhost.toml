[app]
name = "minecraft-agents"
version = "0.1.0"
description = "LLM-driven Mineflayer agents; one app configures any number of bots"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

# Planner API keys are pulled from the OpenHost secrets service at boot.
# OPENAI_API_KEY is only needed when a bot uses the gpt-5.6-luna model.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [{ key = "ANTHROPIC_API_KEY" }, { key = "OPENAI_API_KEY" }]

[resources]
memory_mb = 6144
cpu_millicores = 3000

[data]
# Persistent state at $OPENHOST_APP_DATA_DIR: SQLite DB (dashboard settings,
# ownership, per-owner memory) plus a shared library/ dir of bot-authored
# routines and reactive settings (JSON files, not the DB).
app_data = true
